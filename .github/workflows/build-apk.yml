name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Extract Android project archive
        shell: bash
        run: |
          set -euo pipefail

          archive="my skibidirel project.tar.gz"

          if [ ! -f "$archive" ]; then
            echo "::error::Archive not found: $archive"
            ls -la
            exit 1
          fi

          tar -xzf "$archive"

          settings_file="$(find . -maxdepth 5 \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

          if [ -z "$settings_file" ]; then
            echo "::error::Archive did not contain a Gradle project"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$settings_file")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-license: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spotify-float-debug
          if-no-files-found: error
          path: |
            ${{ env.PROJECT_DIR }}/**/*.apk

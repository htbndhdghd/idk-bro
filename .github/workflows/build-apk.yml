name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Extract Android project archive
        shell: bash
        run: |
          set -euo pipefail

          archive="my skibidirel project.tar.gz"

          if [ ! -f "$archive" ]; then
            echo "::error::Archive not found: $archive"
            ls -la
            exit 1
          fi

          tar -xzf "$archive"

          settings_file=""
          while IFS= read -r candidate; do
            dir="$(dirname "$candidate")"
            if [ -f "$dir/gradlew" ] || [ -f "$dir/build.gradle" ] || [ -f "$dir/build.gradle.kts" ]; then
              settings_file="$candidate"
              break
            fi
          done < <(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) 2>/dev/null)

          if [ -z "$settings_file" ]; then
            echo "::error::Archive did not contain a Gradle project"
            find . -maxdepth 12 -type f | sort
            exit 1
          fi

          project_dir="$(dirname "$settings_file")"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-license: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$sdk_root"
          export ANDROID_HOME="$sdk_root"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Export Android SDK env
        shell: bash
        run: |
          set -euo pipefail

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "PATH=$PATH:$sdk_root/platform-tools:$sdk_root/build-tools/35.0.0" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          set -euo pipefail

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spotify-float-debug
          if-no-files-found: error
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
